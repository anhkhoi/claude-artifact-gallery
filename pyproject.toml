[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-artifact-gallery"
version = "0.1.0"
description = "Browse your Claude artifacts in one page: a searchable gallery of published claude.ai artifacts and local design canvases, found by scanning a project folder."
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
claude-artifact-gallery = "claude_artifact_gallery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
